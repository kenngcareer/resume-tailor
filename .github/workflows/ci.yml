name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: py -m pip install -e .[dev]

      - name: Run tests
        run: py -m pytest
