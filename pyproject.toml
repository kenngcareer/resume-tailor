[project]
name = "resume-tailor"
version = "0.1.0"
description = "Local-first resume tailoring workflow for job applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "pydantic>=2.7.0",
  "python-docx>=1.1.2",
  "pypdf>=5.0.0",
  "pyyaml>=6.0.1"
]

[project.scripts]
resume-tailor = "resume_tailor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
